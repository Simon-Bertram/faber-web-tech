  zod: ^4.6.7
  typescript: ^6.0.3
  "@types/node": ^26.6.5
  "@cloudflare/workers-types": ^5.20261023.1
  hono: ^4.13.13
  "@orpc/server": ^1.15.6
  "@orpc/openapi": ^1.15.6
  "@orpc/zod": ^1.15.6
  better-auth: 1.7.12
  evlog: ^2.33.1
  "@orpc/client": ^1.16.1
