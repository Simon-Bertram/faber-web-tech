packages:
  - apps/*
  - packages/*
allowBuilds:
  core-js: true
  esbuild: true
  sharp: true
  unrs-resolver: true
  workerd: true
catalog:
  dotenv: ^17.4.2
  zod: ^4.4.3
  typescript: ^6.0.3
  "@types/node": ^22.20.1
  "@cloudflare/workers-types": ^4.20260702.1
  hono: ^4.8.2
  "@orpc/server": ^1.14.13
  "@orpc/openapi": ^1.14.13
  "@orpc/zod": ^1.14.13
  better-auth: 1.7.1
  alchemy: ^0.91.2
  wrangler: ^4.125.0
  "@orpc/client": ^1.15.0
# Alchemy still peers Astro 5 / @astrojs/cloudflare 12; its Astro adapter is a
# thin wrapper around the Cloudflare adapter and works with Astro 7.
peerDependencyRules:
  allowedVersions:
    "alchemy>astro": "7"
    "alchemy>@astrojs/cloudflare": "14"
minimumReleaseAgeExclude:
  - "@astrojs/markdown-satteri@0.3.4"
  - astro@7.0.9 || 7.2.7
  - "@astrojs/cloudflare@14.1.3 || 14.2.5"
  - "@turbo/darwin-64@2.10.12"
  - "@turbo/darwin-arm64@2.10.12"
  - "@turbo/linux-64@2.10.12"
  - "@turbo/linux-arm64@2.10.12"
  - "@turbo/windows-64@2.10.12"
  - "@turbo/windows-arm64@2.10.12"
  - turbo@2.10.12
